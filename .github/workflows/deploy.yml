name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Mumbai: next to the users and the wayfinder Firestore database (asia-south1)
  REGION: asia-south1
  SERVICE: wayfinder-server
  PROJECT_ID: project-7d0d26b8-5887-43f6-804

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Server: build & deploy to Cloud Run ──────────────────
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - id: deploy-server
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: server/
          env_vars: >
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},FIRESTORE_DATABASE=wayfinder,NODE_ENV=production
          # The city simulation lives in memory and runs all the time: exactly one
          # instance, CPU always on, room for the full Bangalore road network
          # (~1.8 GB in use at rush hour, so 2 GiB is too tight).
          flags: >-
            --memory=4Gi --cpu=2 --min-instances=1 --max-instances=1
            --no-cpu-throttling --timeout=3600 --concurrency=1000

      - name: Show server URL
        if: github.ref == 'refs/heads/main'
        run: echo "Server deployed to ${{ steps.deploy-server.outputs.url }}"

      # ── Client: build & deploy to Firebase Hosting ───────────
      - run: npm ci

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ env.PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ env.PROJECT_ID }}.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE: wayfinder

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.PROJECT_ID }}
          # WayFinder's Hosting site (target in .firebaserc)
          target: wayfinder
