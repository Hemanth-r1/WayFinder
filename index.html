<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WayFinder — Smart traffic and navigation for Bengaluru | TUFF Foundation</title>
    <meta name="description" content="WayFinder by TUFF Foundation: live Bengaluru traffic, adaptive signals, emergency green corridors and navigation that spreads drivers across the city." />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="WayFinder" />
    <meta property="og:title" content="WayFinder — by TUFF Foundation" />
    <meta property="og:description" content="Smart traffic and navigation for Bengaluru." />
    <meta property="og:site_name" content="WayFinder" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-mobile-web-app-title" content="WayFinder" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Theme before the first paint (no flash); src/theme.ts takes over afterwards
      (function () {
        var t = null;
        try { t = localStorage.getItem('wf-theme'); } catch (e) { t = null; }
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef4ff');
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      html, body { background: #000; color: #e8f2ff; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eef4ff; color: #10213d; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
